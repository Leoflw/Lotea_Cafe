name: lotea_cafe
description: "Lotea Café — marketplace móvil de café colombiano. Descubre. Compara. Conecta."
publish_to: "none"
version: 0.5.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado de la UI
  provider: ^6.1.2

  # Firebase (Auth y Firestore). Las fotos ya NO usan Cloud Storage: se suben
  # a ImageKit (ver IMAGEKIT_SETUP.md).
  # Conjunto coordinado FlutterFire BoM 5.1.0 (22-oct-2026): estas cuatro librerías
  # deben subir JUNTAS (firebase_core 5.x ↔ firebase_auth 7.x ↔ cloud_firestore 7.x ↔
  # firebase_messaging 17.x). Requieren Android minSdk 24 (Flutter 3.47 ya lo da con
  # `flutter.minSdkVersion`) y arrastran el SDK nativo Firebase Android BoM 35.x, que
  # reemplaza a firebase-auth 23.2.1, la versión nativa con la que se vio el error de
  # Keystore en el Samsung A32 (ver INFORME_MIGRACION_FIREBASE_BOM_5_1.md).
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0

  # Notificaciones push (FCM). La línea 17.x es la que acompaña a firebase_core 5.x:
  # no la subas ni la bajes sin mover también firebase_core. Ver PUSH_NOTIFICATIONS.md.
  firebase_messaging: ^17.0.1

  # Subida de fotos a ImageKit (HTTPS, multipart/form-data)
  http: ^1.2.2
  http_parser: ^4.0.2

  # UI / UX
  google_fonts: ^6.2.1
  flutter_card_swiper: ^7.0.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  uuid: ^4.5.1

  # Preferencia local «Mantener sesión iniciada» (UN booleano, `mantener_sesion`).
  # Nunca se guardan contraseñas ni tokens de autenticación.
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  fake_cloud_firestore: ^4.5.0 # pruebas de persistencia sin Firebase real (línea 4.x ↔ cloud_firestore 7.x)

# Regenera los iconos nativos: `dart run flutter_launcher_icons`
# (ver README.md, sección «Identidad visual»). Los recursos generados ya están
# incluidos en android/app/src/main/res/.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/lotea_cafe_icon.png"
  adaptive_icon_background: "#FBF3E7"
  adaptive_icon_foreground: "assets/branding/lotea_cafe_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/lotea_cafe_symbol.png
